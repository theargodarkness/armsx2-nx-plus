name: Switch Build

# Builds the Nintendo Switch homebrew (yadokari.nro) with devkitA64 and uploads
# it as a workflow artifact.
#
#   release      the build to play on
#   diagnostics  links the validating deko3d and writes the first GPU queue error
#                to exit.txt (ARMSX2_DK3D_DIAGNOSTICS); slower, for renderer crashes.
#                Add -DARMSX2_DK3D_DIAG_SYNC=ON to wait on every submission as well.
#   nospin       the release build with waiting threads blocking instead of spinning
#                (ARMSX2_WAIT_SPIN_US=0); an experiment to compare against release
#
# The symbolize job is only for reading profiler reports: it rebuilds the commit
# a report came from and prints function names for tools/switch/profile-offsets.txt.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: switch-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The DK3D shaders need this uam fork; devkitPro's packaged uam miscompiles some effects.
  UAM_REPO: https://github.com/PalindromicBreadLoaf/uam
  UAM_REV: c0d76aa9107d67edcd35a1b717ace87ee7939c68

jobs:
  build:
    name: Switch NRO (${{ matrix.variant }})
    if: ${{ !contains(github.event.head_commit.message, '[symbolize-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The image already carries deko3d and every Switch portlib this needs. Do not add a
    # dkp-pacman step: devkitPro's package server refuses GitHub runners intermittently (403).
    container:
      image: devkitpro/devkita64:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            cmake_args: ''
          - variant: diagnostics
            cmake_args: '-DARMSX2_DK3D_DIAGNOSTICS=ON'
          - variant: nospin
            cmake_args: '-DARMSX2_WAIT_SPIN_US=0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ninja-build meson bison flex pkg-config python3 python3-mako ca-certificates

      - name: Fetch uam
        run: |
          git clone "$UAM_REPO" switch/externals/uam
          git -C switch/externals/uam checkout "$UAM_REV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_VULKAN=OFF ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build -- -k 0

      - name: Collect outputs
        run: |
          mkdir out
          cp "$(find build -name 'yadokari.nro' | head -n 1)" "out/yadokari-${{ matrix.variant }}.nro"
          cp "$(find build -name 'yadokari.elf' | head -n 1)" "out/yadokari-${{ matrix.variant }}.elf"
          ls -l out

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: yadokari-${{ matrix.variant }}-${{ github.sha }}
          path: out/yadokari-${{ matrix.variant }}.nro
          if-no-files-found: error

      - name: Upload ELF (symbols for profiler reports)
        uses: actions/upload-artifact@v4
        with:
          name: yadokari-${{ matrix.variant }}-elf-${{ github.sha }}
          path: out/yadokari-${{ matrix.variant }}.elf
          if-no-files-found: error

  symbolize:
    name: Symbolize profile offsets
    # Opt in with [symbolize] in the commit message; it is a whole extra build.
    if: contains(github.event.head_commit.message, '[symbolize]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: devkitpro/devkita64:latest
    env:
      # The commit the profiled NRO was built from, and the variant's CMake arguments.
      PROFILE_COMMIT: e5622fe6622ef34fcf0139dafaef1bf0dc7cf21a
      PROFILE_CMAKE_ARGS: ''
      # Debug info only: GCC generates the same code with -g, and the layout check
      # in the report says whether that held.
      CFLAGS: -g
      CXXFLAGS: -g
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          path: tools-src
          sparse-checkout: tools/switch

      - name: Checkout the profiled commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROFILE_COMMIT }}
          path: src
          submodules: recursive

      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ninja-build meson bison flex pkg-config python3 python3-mako ca-certificates

      - name: Fetch uam
        run: |
          git clone "$UAM_REPO" src/switch/externals/uam
          git -C src/switch/externals/uam checkout "$UAM_REV"

      - name: Build the profiled commit
        run: |
          cmake -S src -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_VULKAN=OFF $PROFILE_CMAKE_ARGS
          cmake --build build --target yadokari

      - name: Symbolize
        run: |
          elf="$(find build -name 'yadokari.elf' | head -n 1)"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm" -nC --defined-only "$elf" > nm.txt
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-objcopy" -O binary "$elf" image.bin
          python3 tools-src/tools/switch/symbolize_profile.py \
            tools-src/tools/switch/profile-offsets.txt nm.txt image.bin \
            "$elf" "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-addr2line"
